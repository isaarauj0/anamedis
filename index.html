<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnaMedis — Seu histórico de saúde em um só lugar</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; margin: 0; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: #0d9488; border-radius: 2px; }
  .fade { animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  .nav-active { background: #134e4a !important; color: white !important; }
  .nav-item { transition: background 0.12s, color 0.12s; }
  .spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .doc-row:hover { background: #f0fdfa; border-color: #5eead4; }
</style>
</head>
<body class="bg-slate-50 overflow-hidden h-screen">

<div id="app" class="flex h-screen overflow-hidden">

  <!-- ===================== SIDEBAR ===================== -->

    <!-- Logo -->

        <div class="min-w-0">
          <div class="text-white text-xs font-semibold truncate">Maria Aparecida</div>

    <!-- Nav -->

        Início
      </button>
      <button onclick="nav('documentos')" id="nav-documentos" class="nav-item w-full text-left flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium" style="color:#9ca3af">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>

      <button onclick="nav('consultas')" id="nav-consultas" class="nav-item w-full text-left flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium" style="color:#9ca3af">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Consultas
      </button>
      <button onclick="nav('compartilhar')" id="nav-compartilhar" class="nav-item w-full text-left flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium" style="color:#9ca3af">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>

      </button>
      <button onclick="nav('saude')" id="nav-saude" class="nav-item w-full text-left flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium" style="color:#9ca3af">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
        Minha Saúde
      </button>
      <button onclick="nav('perfil')" id="nav-perfil" class="nav-item w-full text-left flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium" style="color:#9ca3af">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        Perfil
      </button>

      <div class="my-2 border-t" style="border-color:#1f2937"></div>

      <button onclick="nav('dispositivos')" id="nav-dispositivos" class="nav-item w-full text-left flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium" style="color:#9ca3af">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>

      <button onclick="nav('assinatura')" id="nav-assinatura" class="nav-item w-full text-left flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium" style="color:#9ca3af">

        Assinatura e pagamento
      </button>
    </nav>

    <!-- Bottom -->
    <div class="p-3 space-y-1.5">
      <button onclick="openDoctorModal()" class="w-full flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs nav-item" style="color:#6b7280">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        Sou médico
      </button>
      <button onclick="nav('documentos')" class="w-full text-white rounded-lg px-4 py-2.5 flex items-center justify-center gap-2 text-sm font-semibold" style="background:#0d9488">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        Adicionar arquivo
      </button>
    </div>
  </aside>

  <!-- ===================== MAIN ===================== -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Top banner -->
    <div class="bg-white border-b flex-shrink-0 px-6 py-2" style="border-color:#f1f5f9">
      <p class="text-xs text-center" style="color:#94a3b8">Seu histórico de saúde em um só lugar</p>
    </div>
    <!-- Page content -->
    <main id="main" class="flex-1 overflow-y-auto" style="background:#f8fafc"></main>

</div>

<!-- ===================== DOCTOR MODAL ===================== -->
<div id="doctor-modal" class="hidden fixed inset-0 flex items-center justify-center z-50 p-4" style="background:rgba(0,0,0,0.6)">
  <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 fade">
    <div class="flex items-start justify-between mb-5">
      <div>
        <h2 class="text-xl font-bold text-gray-900">Acesso do Médico</h2>
        <p class="text-sm text-gray-500 mt-0.5">Digite o código gerado pelo paciente</p>
      </div>
      <button onclick="closeDoctorModal()" class="text-gray-400 hover:text-gray-600 mt-0.5">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="dm-input">
      <label class="block text-sm font-medium text-gray-700 mb-2">Código de acesso</label>
      <input id="dm-code" type="text" placeholder="SAUDE-XXXX-XX"
        class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-center text-xl font-mono tracking-widest uppercase focus:outline-none focus:border-teal-400"
        oninput="this.value=this.value.toUpperCase()"
        onkeydown="if(event.key==='Enter')verifyCode()">
      <div class="text-xs text-center mt-2" style="color:#6b7280">Código demo: <strong>SAUDE-7K4P-92</strong></div>
      <p id="dm-error" class="hidden text-red-500 text-sm text-center mt-2">Código inválido ou expirado.</p>
      <button onclick="verifyCode()" class="w-full text-white rounded-xl py-3 font-semibold mt-4" style="background:#0d9488">
        Acessar histórico
      </button>
    </div>
    <div id="dm-loading" class="hidden text-center py-6">
      <div class="w-10 h-10 border-4 rounded-full spin mx-auto mb-3" style="border-color:#ccfbf1;border-top-color:#0d9488"></div>
      <p class="text-gray-600">Verificando acesso...</p>
    </div>
  </div>
</div>

<!-- ===================== DOCTOR VIEW ===================== -->
<div id="doctor-view" class="hidden fixed inset-0 overflow-y-auto z-40" style="background:#f8fafc">
  <div id="doctor-view-content"></div>
</div>

<script>
// ---- DATA ----
const docs = [
  { id:1, type:'Exame',    name:'Hemograma Completo',              source:'Fleury',           date:'15/10/2024', desc:'Resultado: Normal',                 icon:'🧪' },
  { id:2, type:'Laudo',    name:'Ecocardiograma',                  source:'CardioCenter',     date:'03/09/2024', desc:'FE: 65% — Normal',                  icon:'❤️' },
  { id:3, type:'Receita',  name:'Losartana 50mg',                  source:'Dr. Carlos Menezes',date:'20/08/2024', desc:'1x ao dia — 90 dias',               icon:'💊' },
  { id:4, type:'Consulta', name:'Consulta de Cardiologia',         source:'Dr. Carlos Menezes',date:'20/08/2024', desc:'Pressão controlada. Manter Losartana.',icon:'👨‍⚕️'},
  { id:5, type:'Exame',    name:'Ressonância Magnética — Coluna',  source:'DASA',             date:'12/07/2024', desc:'Sem alterações significativas',      icon:'🔬' },
  { id:6, type:'Vacina',   name:'Influenza 2024',                  source:'UBS Vila Mariana', date:'05/04/2024', desc:'Lote: FLU24-BR',                     icon:'💉' },
];

const consultas = [
  { id:1, spec:'Cardiologia',  doctor:'Dr. Carlos Menezes', date:'20/08/2024', local:'CardioCenter — SP',         status:'Realizada', notes:'Pressão controlada. Manter Losartana 50mg.' },
  { id:2, spec:'Ortopedia',    doctor:'Dra. Paula Fonseca', date:'12/07/2024', local:'Hospital Sírio-Libanês',    status:'Realizada', notes:'RM sem alterações. Fisioterapia recomendada.' },
  { id:3, spec:'Clínico Geral',doctor:'Dr. André Lima',    date:'05/06/2024', local:'UBS Vila Mariana',           status:'Realizada', notes:'Check-up anual. Todos os exames normais.' },
];

// ---- STATE ----
let currentScreen = '';
let generatedCode = '';
let codeTimeLeft = 1800;
let codeTimerID = null;
let docFilter = 'Todos';

// ---- NAV ----
const SCREENS = ['inicio','documentos','consultas','compartilhar','saude','perfil','dispositivos','acessos','conta','assinatura'];

function nav(s) {
  currentScreen = s;
  SCREENS.forEach(x => {
    const el = document.getElementById('nav-' + x);
    if (!el) return;
    el.classList.remove('nav-active');
    el.style.color = '#9ca3af';
  });
  const a = document.getElementById('nav-' + s);
  if (a) { a.classList.add('nav-active'); a.style.color = ''; }
  render(s);
}

function render(s) {
  const main = document.getElementById('main');
  const wrap = document.createElement('div');
  wrap.className = 'fade p-6';
  switch(s) {
    case 'inicio':       wrap.innerHTML = screenInicio(); break;
    case 'documentos':   wrap.innerHTML = screenDocumentos(); break;
    case 'consultas':    wrap.innerHTML = screenConsultas(); break;
    case 'compartilhar': wrap.innerHTML = screenCompartilhar(); break;
    case 'saude':        wrap.innerHTML = screenSaude(); break;
    case 'perfil':       wrap.innerHTML = screenPerfil(); break;
    case 'dispositivos': wrap.innerHTML = screenDispositivos(); break;
    case 'acessos':      wrap.innerHTML = screenAcessos(); break;
    case 'conta':        wrap.innerHTML = screenConta(); break;
    case 'assinatura':   wrap.innerHTML = screenAssinatura(); break;
    default: wrap.innerHTML = screenInicio();
  }
  main.innerHTML = '';
  main.appendChild(wrap);
  if (s === 'compartilhar' && generatedCode) refreshCodeDisplay();
}

// ---- TIPO COLOR ----
function typeColor(t) {
  return { Exame:'bg-blue-50 text-blue-700', Laudo:'bg-purple-50 text-purple-700', Consulta:'bg-green-50 text-green-700', Receita:'bg-orange-50 text-orange-700', Vacina:'bg-pink-50 text-pink-700' }[t] || 'bg-gray-100 text-gray-600';
}

// ---- SCREENS ----
function screenInicio() {
  return `
  <div class="max-w-3xl">
    <div class="flex items-center justify-between mb-5">
      <div>
        <p class="text-sm text-gray-500">Olá,</p>
        <h1 class="text-2xl font-bold text-gray-900">Maria Aparecida</h1>
      </div>
      <button class="text-sm font-medium" style="color:#0d9488">Mostrar nomes</button>
    </div>

    <div class="rounded-xl p-3 mb-5 flex items-start gap-3 border" style="background:#eff6ff;border-color:#bfdbfe">
      <svg class="w-4 h-4 mt-0.5 flex-shrink-0" style="color:#3b82f6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01"/></svg>
      <div>
        <p class="text-sm font-medium" style="color:#1e40af">Seu acesso é oferecido por AnaMedis (demonstração)</p>
        <p class="text-xs mt-0.5" style="color:#3b82f6">A operadora não recebe acesso ao seu histórico.</p>
      </div>
    </div>

    <div class="rounded-2xl p-6 mb-5 relative overflow-hidden" style="background:linear-gradient(135deg,#134e4a 0%,#0d9488 60%,#0891b2 100%)">
      <div class="relative z-10">
        <p class="text-sm mb-1" style="color:#a7f3d0">Vai a uma consulta?</p>
        <h2 class="font-bold text-xl text-white mb-1">Mostre todo o seu histórico ao médico com um código</h2>
        <p class="text-sm mb-5" style="color:#99f6e4">Você escolhe o que ele vê e por quanto tempo. Evite repetir exames que você já fez.</p>
        <div class="flex gap-3 flex-wrap">
          <button onclick="nav('compartilhar');setTimeout(gerarCodigo,80)" class="text-white rounded-xl px-5 py-2.5 text-sm font-semibold flex items-center gap-2 transition-all" style="background:rgba(0,0,0,0.25)">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
            Gerar código para o médico
          </button>
          <button onclick="openDoctorModal()" class="text-white rounded-xl px-5 py-2.5 text-sm font-semibold transition-all" style="background:rgba(255,255,255,0.18)">
            Recebi um código do médico
          </button>
        </div>
      </div>
      <div class="absolute -right-6 -top-6 w-28 h-28 rounded-full" style="background:rgba(255,255,255,0.05)"></div>
      <div class="absolute right-2 bottom-0 w-16 h-16 rounded-full" style="background:rgba(255,255,255,0.05)"></div>
    </div>

    <div class="bg-white rounded-xl border border-gray-100 p-4 mb-4">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-semibold text-sm text-gray-900">Seu histórico</h3>
        <button onclick="nav('documentos')" class="text-xs font-medium" style="color:#0d9488">Ver tudo →</button>
      </div>
      <div class="grid grid-cols-3 divide-x divide-gray-100">
        <div class="text-center px-3 py-1"><div class="text-2xl font-bold text-gray-900">6</div><div class="text-xs text-gray-500 mt-0.5">Documentos</div></div>
        <div class="text-center px-3 py-1"><div class="text-2xl font-bold text-gray-900">3</div><div class="text-xs text-gray-500 mt-0.5">Exames</div></div>
        <div class="text-center px-3 py-1"><div class="text-2xl font-bold text-gray-900">1</div><div class="text-xs text-gray-500 mt-0.5">Receitas</div></div>
      </div>
    </div>

    <div class="bg-white rounded-xl border border-gray-100 p-4">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-semibold text-sm text-gray-900">Dispositivos</h3>
        <button onclick="nav('dispositivos')" class="text-xs font-medium" style="color:#0d9488">Conectar →</button>
      </div>
      <p class="text-sm text-gray-500 mb-1">Nenhum dispositivo conectado</p>
      <p class="text-xs text-gray-400 mb-3">Conecte um relógio, anel ou cinta para ver frequência cardíaca, sono e passos aqui.</p>
      <div class="grid grid-cols-3 gap-2">
        ${[['⌚','Relógio ou anel'],['🩺','Cinta Bluetooth'],['📱','Outro aplicativo']].map(([ic,lb])=>`
          <div class="border border-gray-100 rounded-xl p-3 text-center cursor-pointer hover:border-teal-200 transition-colors" style="">
            <div class="text-xl mb-1">${ic}</div>
            <div class="text-xs text-gray-500 font-medium">${lb}</div>
          </div>`).join('')}
      </div>
    </div>
  </div>`;
}

function screenDocumentos() {
  return `
  <div class="max-w-3xl">
    <div class="flex items-center justify-between mb-5">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Meus documentos</h1>
        <p class="text-sm text-gray-500 mt-0.5">${docs.length} documentos no seu histórico</p>
      </div>
      <button class="text-white rounded-xl px-4 py-2 text-sm font-semibold flex items-center gap-2" style="background:#0d9488">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        Adicionar
      </button>
    </div>
    <div class="relative mb-3">
      <svg class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input id="dsearch" type="text" placeholder="Buscar por nome"
        class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-teal-400 bg-white"
        oninput="filterDocs()">
    </div>
    <div class="flex gap-2 mb-4 overflow-x-auto pb-1">
      ${['Todos','Exame','Laudo','Consulta','Receita','Vacina'].map(f=>`
        <button onclick="setFilter('${f}')" id="f-${f}"
          class="flex-shrink-0 px-4 py-1.5 rounded-full text-sm font-medium border transition-colors ${f==='Todos'?'text-white border-transparent':'text-gray-600 bg-white border-gray-200'}"
          style="${f==='Todos'?'background:#0d9488':''}">${f}</button>`).join('')}
    </div>
    <div id="doclist" class="space-y-2">${docRows(docs)}</div>
  </div>`;
}

function docRows(list) {
  if (!list.length) return '<div class="text-center py-12 text-gray-400"><div class="text-4xl mb-3">📄</div><p>Nenhum documento encontrado</p></div>';
  return list.map(d=>`
    <div class="doc-row bg-white rounded-xl border border-gray-100 p-4 flex items-center gap-3 cursor-pointer transition-colors">
      <div class="w-10 h-10 rounded-xl flex items-center justify-center text-xl flex-shrink-0" style="background:#f0fdfa">${d.icon}</div>
      <div class="flex-1 min-w-0">
        <div class="font-medium text-sm text-gray-900 truncate">${d.name}</div>
        <div class="text-xs text-gray-500 mt-0.5">${d.source} · ${d.date}</div>
      </div>
      <span class="text-xs px-2.5 py-1 rounded-full font-medium ${typeColor(d.type)}">${d.type}</span>
    </div>`).join('');
}

function setFilter(f) {
  docFilter = f;
  ['Todos','Exame','Laudo','Consulta','Receita','Vacina'].forEach(x=>{
    const b = document.getElementById('f-'+x);
    if (!b) return;
    if (x===f) { b.style.background='#0d9488'; b.style.color='white'; b.style.borderColor='transparent'; }
    else        { b.style.background='white';    b.style.color='#4b5563'; b.style.borderColor='#e5e7eb'; }
  });
  filterDocs();
}

function filterDocs() {
  const q = (document.getElementById('dsearch')?.value||'').toLowerCase();
  const list = docs.filter(d=>(docFilter==='Todos'||d.type===docFilter)&&(!q||d.name.toLowerCase().includes(q)||d.source.toLowerCase().includes(q)));
  const el = document.getElementById('doclist');
  if (el) el.innerHTML = docRows(list);
}

function gerarCodigo() {
  const ch = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const p1 = Array.from({length:4},()=>ch[Math.floor(Math.random()*ch.length)]).join('');
  const p2 = Array.from({length:2},()=>ch[Math.floor(Math.random()*ch.length)]).join('');
  generatedCode = `SAUDE-${p1}-${p2}`;
  codeTimeLeft = 1800;
  refreshCodeDisplay();
  if (codeTimerID) clearInterval(codeTimerID);
  codeTimerID = setInterval(tickTimer, 1000);
}

function refreshCodeDisplay() {
  const cv = document.getElementById('code-val');
  const cd = document.getElementById('code-display');
  const gb = document.getElementById('gen-btn');
  if (cv) cv.textContent = generatedCode;
  if (cd) cd.classList.remove('hidden');
  if (gb) gb.classList.add('hidden');
}

function tickTimer() {
  if (codeTimeLeft <= 0) {
    clearInterval(codeTimerID);
    generatedCode = '';
    const cd = document.getElementById('code-display');
    const gb = document.getElementById('gen-btn');
    if (cd) cd.classList.add('hidden');
    if (gb) gb.classList.remove('hidden');
    return;
  }
  codeTimeLeft--;
  const m = String(Math.floor(codeTimeLeft/60)).padStart(2,'0');
  const s = String(codeTimeLeft%60).padStart(2,'0');
  const t = document.getElementById('timer');
  if (t) t.textContent = `${m}:${s}`;
}

function copyCode() {
  navigator.clipboard?.writeText(generatedCode);
  const btn = event.currentTarget;
  const orig = btn.innerHTML;
  btn.innerHTML = '<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg> Copiado!';
  setTimeout(()=>{ btn.innerHTML = orig; }, 2000);
}

// ---- DOCTOR MODAL ----
function openDoctorModal() {
  const m = document.getElementById('doctor-modal');
  const inp = document.getElementById('dm-input');
  const ld = document.getElementById('dm-loading');
  const err = document.getElementById('dm-error');
  const code = document.getElementById('dm-code');
  m.classList.remove('hidden');
  inp.classList.remove('hidden');
  ld.classList.add('hidden');
  err.classList.add('hidden');
  if (code) { code.value = ''; setTimeout(()=>code.focus(), 80); }
}

function closeDoctorModal() {
  document.getElementById('doctor-modal').classList.add('hidden');
}

function verifyCode() {
  const code = (document.getElementById('dm-code')?.value||'').trim().toUpperCase();
  document.getElementById('dm-input').classList.add('hidden');
  document.getElementById('dm-loading').classList.remove('hidden');
  setTimeout(() => {
    closeDoctorModal();
    if (code.startsWith('SAUDE-') || code === generatedCode) {
      showDoctorView();
    } else {
      document.getElementById('dm-loading').classList.add('hidden');
      document.getElementById('dm-input').classList.remove('hidden');
      document.getElementById('dm-error').classList.remove('hidden');
      openDoctorModal();
    }
  }, 1400);
}

let doctorTimeLeft = 1800;

  const dv = document.getElementById('doctor-view');

  dv.classList.remove('hidden');
  dvc.innerHTML = buildDoctorView();
  if (doctorTimerID) clearInterval(doctorTimerID);
  doctorTimerID = setInterval(() => {
    doctorTimeLeft--;
    const m = String(Math.floor(doctorTimeLeft/60)).padStart(2,'0');
    const s = String(doctorTimeLeft%60).padStart(2,'0');
    const t = document.getElementById('dv-timer');
    if (t) t.textContent = `${m}:${s}`;
    if (doctorTimeLeft<=0) {
      clearInterval(doctorTimerID);
      closeDoctorView();
